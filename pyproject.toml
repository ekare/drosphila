[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flyrot"
version = "0.3.0"
description = "RGB-only relative camera rotation research inspired by fly motion vision"
keywords = ["drosophila melanogaster", "drosophila", "melanogaster", "computer vision", "visual odometry"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "opencv-python-headless>=4.8",
    "torch==2.5.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.7", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
