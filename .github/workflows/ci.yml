name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
      - name: Tests
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Diff check
        run: git diff --check
      - name: Build distributions
        run: python -m build
      - name: Check wheel contents
        run: python scripts/check_wheel.py
      - name: Synthetic smoke
        run: |
          python scripts/rotation_residual.py \
            --checkpoint /tmp/does-not-exist-flyrot-checkpoint.pt \
            --synthetic-smoke-test \
            --image-size 128 \
            --output artifacts/ci_synthetic_smoke
